name: Docker Rebuild

# Rebuilds and republishes the Docker image when the Dockerfile changes on main.
# This is triggered by Dependabot PRs that update the base image SHA, ensuring
# the published image stays up to date with upstream OS/JRE security patches.
#
# Can also be triggered manually (workflow_dispatch) to rebuild the image for a
# specific released version, e.g. to fix a broken image without a new release.
#
# Note: Java library dependencies are bundled in the Clouseau release artifact
# and are not updated here. Dependabot can update SBT dependencies, but those
# require a new Clouseau release to take effect.
on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile'
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to rebuild the image for (e.g. 3.4.0)'
        required: true

jobs:
  docker-rebuild:
    name: Rebuild and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build JAR artifact
        if: github.event_name == 'push'
        run: make jar

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "short=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            FULL=$(make version)
            SHORT=$(echo $FULL | sed 's/-.*//')
            echo "full=$FULL" >> $GITHUB_OUTPUT
            echo "short=$SHORT" >> $GITHUB_OUTPUT
          fi

      - name: Build and publish
        uses: ./.github/actions/docker-publish
        with:
          version: ${{ steps.version.outputs.short }}
          full-version: ${{ steps.version.outputs.full }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-mode: ${{ github.event_name == 'workflow_dispatch' && 'release' || 'local' }}
          include-patch-tag: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          only-patch-tag: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
