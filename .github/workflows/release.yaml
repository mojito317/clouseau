name: Release 3.x

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Release of clouseau-{version}-dist.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set ENV for github-release
        run: |
          echo "RELEASE_TAG=${GITHUB_REF:10}" >> $GITHUB_ENV
          echo "RELEASE_NAME=$GITHUB_WORKFLOW" >> $GITHUB_ENV

      - name: Test
        run: mise exec -- make test
      - name: Generate artifacts
        run: mise exec -- make artifacts
      - name: List artifacts
        run: ls artifacts
      - name: Create release
        run: mise exec -- make release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker-release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Get version from version.sbt
        id: version
        run: |
          VERSION=$(make version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            BUILD_MODE=release
            CLOUSEAU_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/mojito317/clouseau:${{ steps.version.outputs.version }}
            ghcr.io/mojito317/clouseau:latest
          platforms: linux/amd64,linux/arm64
