name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Prepare a Clouseau release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Set ENV for github-release
        run: |
          echo "RELEASE_TAG=${GITHUB_REF:10}" >> $GITHUB_ENV
          echo "RELEASE_NAME=$GITHUB_WORKFLOW" >> $GITHUB_ENV

      - name: Generate artifacts
        run: make artifacts

      - name: List artifacts
        run: ls artifacts

      - name: Create release
        run: make release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker-release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for release assets to be available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/mojito317/clouseau/releases/download/${VERSION}/checksums.txt"
          echo "Waiting for release asset: ${URL}"
          for i in $(seq 1 20); do
            STATUS=$(curl -sLo /dev/null -w "%{http_code}" "${URL}")
            echo "Attempt ${i}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Asset is available."
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: Release asset not available after waiting."
          exit 1

      - name: Build and publish
        uses: ./.github/actions/docker-publish
        with:
          version: ${{ steps.version.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
