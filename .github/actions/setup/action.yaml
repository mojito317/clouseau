name: 'Setup Environment'
description: 'Setup common environment'
runs:
  using: 'composite'
  steps:
    - run: git config advice.detachedHead false
      shell: bash
    - name: Install mise & tools
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        install: true
        env: true
        cache: true
        export_path: true
